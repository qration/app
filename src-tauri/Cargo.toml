[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

[profile.dev]
debug = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.0.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rss = { version = "2.1.0", features = ["serde"] }
thiserror = "2.0.19"
specta-typescript = "0.0.12"
nanoid = "0.5.0"
atom_syndication = "0.12.9"
ammonia = "4.1.4"
html2text = "0.17.1"
url = "2.5.8"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
dateparser = "0.3.1"
tauri-plugin-notifications = { version = "0.4" }
futures = "0.3.33"
